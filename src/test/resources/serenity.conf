webdriver {
  driver = remote
  remote.url = "http://localhost:9515"
  remote.driver = chrome
  autodownload = false
}

chrome.switches = "--remote-allow-origins=*;--start-maximized"

serenity {
  take.screenshots = FOR_FAILURES
}

chrome_preferences {
  download.prompt_for_download = false
  download.default_directory = target/downloads
}